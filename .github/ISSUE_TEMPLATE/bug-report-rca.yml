name: Bug Report (RCA)
description: RCA template for recurring or high-impact bugs
type: "Bug"
labels: ["RCA"]
body:
  - type: textarea
    id: problem-description
    attributes:
      label: "Problem Description (D2)"
      description: "What do we think it is? What do we know? Which processes are involved?"
    validations:
      required: true

  - type: textarea
    id: containment
    attributes:
      label: "Interim Containment (D3)"
      description: "What can we do to contain the problem?"

  - type: textarea
    id: root-cause
    attributes:
      label: "Root Cause (D4)"
      description: "What caused this? Are there deeper underlying causes?"
      value: "Add before closing"

  - type: textarea
    id: prevent-recurrence
    attributes:
      label: "Prevention (D7)"
      description: "What changes prevent this from happening again?"
      value: "Add before closing"

  - type: markdown
    attributes:
      value: |
        ---
        ### 8D Process
        **D0: Emergency Response** - EPAC support, Teams channels: R201, R202, R204
        **D1: Use a team approach** - Seek & offer team support
        **D2: Describe the problem** - Problem Description field (above)
        **D3: Interim Containment Plan** - Interim Containment field (above)
        **D4: Define and verify root cause** - Root Cause field (above)
        **D5: Select permanent corrective action** - Testing, PR, review
        **D6: Implement permanent corrective action** - Request changes, merge, deploy
        **D7: Prevent recurrence** - Prevention field (above)
        **D8: Recognise the team** - Share updates & learnings (retrospectives, planning, demos)
